<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunte ao Honeypot</title>
    <!-- CSS estático do Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Logótipo Favo de Mel (SVG) -->
        <div class="logo">
            <svg width="70" height="70" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Hexágono Superior -->
                <polygon points="50,5 72,17.5 72,42.5 50,55 28,42.5 28,17.5" fill="#FFA500"/>
                <!-- Hexágono Inferior Direito -->
                <polygon points="73,44 95,56.5 95,81.5 73,94 51,81.5 51,56.5" fill="#FF8C00"/>
                <!-- Hexágono Inferior Esquerdo (Apenas contorno/vazio) -->
                <polygon points="27,44 49,56.5 49,81.5 27,94 5,81.5 5,56.5" fill="none" stroke="#FFA500" stroke-width="2"/>
            </svg>
        </div>

        <!-- Formulário de Entrada do Honeypot -->
        <form id="chatForm" class="search-box">
            <input 
                type="text" 
                id="userInput" 
                name="prompt" 
                placeholder="Pergunte ao Honeypot" 
                autocomplete="off"
                required
            />
        </form>
    </div>

    <!-- JS estático do Flask -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
