<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ativação de Conta</title>
    <!-- CSS estático do Flask -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <!-- Logótipo Favo de Mel (SVG) -->
      <div class="logo">
        <svg width="70" height="70" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,5 72,17.5 72,42.5 50,55 28,42.5 28,17.5" fill="#FFA500" />
          <polygon points="73,44 95,56.5 95,81.5 73,94 51,81.5 51,56.5" fill="#FF8C00" />
          <polygon points="27,44 49,56.5 49,81.5 27,94 5,81.5 5,56.5" fill="none" stroke="#FFA500" stroke-width="2" />
        </svg>
      </div>

      <form id="activateForm" class="painel estreito" method="POST" action="/activate.php">
        <h1 class="titulo">Ativar conta</h1>
        <p class="subtitulo">Informe o e-mail cadastrado e o código de ativação recebido.</p>
        <input type="email" name="email" placeholder="E-MAIL" autocomplete="on" required />
        <input type="text" name="codigo" placeholder="CÓDIGO (ex: HW-XXXX-XXXX)" autocomplete="off" required />
        <input type="password" name="nova_senha" placeholder="NOVA SENHA" autocomplete="off" required />
        <button type="submit" class="botao cheio">Ativar</button>
        <p class="rodape">
          Não recebeu o código? <a href="/mail.php" class="link">Reenviar e-mail</a>
        </p>
      </form>

      <!-- Área onde aparece o "Processando..." e depois a resposta -->
      <div id="resposta" class="resposta"></div>
    </div>

    <!-- JS estático do Flask -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
